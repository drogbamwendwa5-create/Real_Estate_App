name: Keep Render API awake

on:
  schedule:
    # Render free services may spin down after 15 minutes without a request.
    # Run often enough to leave a small buffer before that limit.
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'Frontend/**'
      - '.github/workflows/render-keepalive.yml'

permissions:
  contents: read

jobs:
  ping-render-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the Render backend
        env:
          RENDER_HEALTH_URL: https://real-estate-app-jvgi.onrender.com/api/health
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-all-errors --max-time 60 \
            "$RENDER_HEALTH_URL"
